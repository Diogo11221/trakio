[project]
name = "trakio-ai"
version = "0.1.0"
description = "Trakio AI/ML service: meal recognition, readiness model and coaching insights"
requires-python = ">=3.12"
dependencies = [
    "anthropic==2.14.0",
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.4",
    "scikit-learn==1.9.1",
    "numpy>=2.1",
    "joblib>=1.4",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
# Speech-to-text runs locally (no audio leaves the server). Large download, so optional.
voice = ["faster-whisper==1.2.1"]
dev = ["pytest>=8", "httpx2"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["trakio_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
