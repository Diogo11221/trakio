# Local stack: PostgreSQL + backend-core.
#   cp .env.example .env && docker compose -f docker.compose.yml up --build
# API on http://localhost:8080 (health: /actuator/health).
name: trakio

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: trakio
      POSTGRES_USER: trakio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    # Only reachable from this machine.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trakio -d trakio"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-core:
    build: ./backend-core
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      TRAKIO_DB_URL: jdbc:postgresql://db:5432/trakio
      TRAKIO_DB_USER: trakio
      TRAKIO_DB_PASSWORD: ${POSTGRES_PASSWORD}
      TRAKIO_JWT_SECRET: ${TRAKIO_JWT_SECRET:-}
      TRAKIO_CORS_ORIGINS: ${TRAKIO_CORS_ORIGINS:-http://localhost:5173}
      TRAKIO_BOOTSTRAP_ADMIN_EMAIL: ${TRAKIO_BOOTSTRAP_ADMIN_EMAIL:-}
      TRAKIO_BOOTSTRAP_ADMIN_PASSWORD: ${TRAKIO_BOOTSTRAP_ADMIN_PASSWORD:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PREMIUM_PRICE_ID: ${STRIPE_PREMIUM_PRICE_ID:-}
      STRIPE_MARKETPLACE_PRICE_ID: ${STRIPE_MARKETPLACE_PRICE_ID:-}
    volumes:
      - uploads:/app/data/uploads
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  db-data:
  uploads:
