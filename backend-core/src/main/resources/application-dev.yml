# Local development: fake payments, demo accounts, a throwaway JWT key. Never deploy with this profile.
spring:
  datasource:
    url: ${TRAKIO_DB_URL:jdbc:postgresql://localhost:5432/trakio}
    username: ${TRAKIO_DB_USER:trakio}
    password: ${TRAKIO_DB_PASSWORD:trakio}

trakio:
  jwt:
    # Dev-only key. Production refuses to start without TRAKIO_JWT_SECRET.
    secret: ${TRAKIO_JWT_SECRET:ZGV2LW9ubHktand0LWtleS1kby1ub3QtdXNlLWluLXByb2R1Y3Rpb24tdHJha2lv}
  payments:
    provider: ${TRAKIO_PAYMENTS_PROVIDER:fake}
  cors:
    allowed-origins: ${TRAKIO_CORS_ORIGINS:http://localhost:5174,http://localhost:8081,http://localhost:19006}
