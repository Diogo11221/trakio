# Trakio backend-core. Secrets come only from environment variables — nothing sensitive in this file.
spring:
  application:
    name: trakio-backend-core
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${TRAKIO_DB_URL:jdbc:postgresql://localhost:5432/trakio}
    username: ${TRAKIO_DB_USER:trakio}
    password: ${TRAKIO_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${TRAKIO_DB_POOL:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 64
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    default-property-inclusion: always
    deserialization:
      # A missing boolean/number in a request means false/0 (required numbers are still checked by @Min).
      fail-on-null-for-primitives: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
  # Behind a reverse proxy, set to "native" or "framework" so the client IP is the real one.
  forward-headers-strategy: ${TRAKIO_FORWARD_HEADERS:none}
  tomcat:
    max-swallow-size: 12MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

trakio:
  zone: Europe/Lisbon
  jwt:
    # Base64, 32+ bytes: `openssl rand -base64 48`
    secret: ${TRAKIO_JWT_SECRET}
    issuer: https://api.trakio.app
    audience: trakio-apps
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  cors:
    allowed-origins: ${TRAKIO_CORS_ORIGINS:http://localhost:5174,http://localhost:8081}
  storage:
    local-dir: ${TRAKIO_STORAGE_DIR:./data/uploads}
    max-file-bytes: 10485760
  payments:
    provider: ${TRAKIO_PAYMENTS_PROVIDER:stripe}
    platform-fee-percent: 10
    premium-price-cents: 499
    marketplace-price-cents: 400
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      premium-price-id: ${STRIPE_PREMIUM_PRICE_ID:}
      marketplace-price-id: ${STRIPE_MARKETPLACE_PRICE_ID:}
      success-url: ${TRAKIO_CHECKOUT_SUCCESS_URL:trakio://checkout/success}
      cancel-url: ${TRAKIO_CHECKOUT_CANCEL_URL:trakio://checkout/cancel}
      connect-return-url: ${TRAKIO_CONNECT_RETURN_URL:trakio://pt/payouts/done}
      connect-refresh-url: ${TRAKIO_CONNECT_REFRESH_URL:trakio://pt/payouts/retry}
  rate-limit:
    auth-per-minute: 20
    general-per-minute: 300
    max-failed-logins: 5
    lockout: 15m
  ai:
    base-url: ${TRAKIO_AI_URL:}
    token: ${TRAKIO_AI_TOKEN:}
    timeout: 20s
  bootstrap-admin:
    email: ${TRAKIO_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${TRAKIO_BOOTSTRAP_ADMIN_PASSWORD:}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
